services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/fintrack
      JWT_SECRET: abc-123-xyz
      JWT_EXPIRES_IN: 1d
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fintrack
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: